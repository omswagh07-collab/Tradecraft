services:
  - type: web
    name: tradecraft-acmw-api
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # Admin credentials are configured in server.js defaults for this event package.
      # You may override them later with ADMIN_EMAIL / ADMIN_PASSWORD environment variables.
      - key: FRONTEND_ORIGIN
        sync: false
      - key: DATA_FILE
        value: /var/data/data.json
    disk:
      name: tradecraft-data
      mountPath: /var/data
      sizeGB: 1
